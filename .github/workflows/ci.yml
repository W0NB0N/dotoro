name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Report the size of the first load
        run: |
          echo "### Build size" >> "$GITHUB_STEP_SUMMARY"
          echo "Everything: $(du -sh apps/web/dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Without music: $(du -sh --exclude=music apps/web/dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
